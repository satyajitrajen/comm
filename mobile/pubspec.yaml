name: app
description: TeamTime Android client — NestJS API, Socket.IO, Jitsi, Firebase FCM.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.5
  firebase_analytics: ^11.4.5
  jitsi_meet_flutter_sdk: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
